services:
  api:
    build:
      target: development
    container_name: rolelens_api_dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://lensuser:lenspassword@db:5432/rolelens_dev
    volumes:
      - .:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    container_name: rolelens_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: lensuser
      POSTGRES_PASSWORD: lenspassword
      POSTGRES_DB: rolelens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensuser -d rolelens_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_dev_data: