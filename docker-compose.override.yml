services:
  api:
    build:
      target: development
    container_name: job_market_api_dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://job_user:job_password@db:5432/jobpulse_dev
    volumes:
      - .:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    container_name: job_market_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: job_password
      POSTGRES_DB: jobpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_user -d jobpulse_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_dev_data: