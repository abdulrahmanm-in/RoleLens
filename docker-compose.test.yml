services:
  api:
    build:
      target: testing

    container_name: rolelens_api_test

    environment:
      - DATABASE_URL=postgresql://lensuser:lenspassword@postgres:5432/rolelens_test
      - TEST_DATABASE_URL=postgresql://lensuser:lenspassword@postgres:5432/rolelens_test
      - ADZUNA_APP_ID=${ADZUNA_APP_ID}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY}

    command: pytest -vv -ra --cov=app

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: rolelens_postgres_test

    environment:
      POSTGRES_USER: lensuser
      POSTGRES_PASSWORD: lenspassword
      POSTGRES_DB: rolelens_test

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lensuser -d rolelens_test"]
      interval: 5s
      timeout: 5s
      retries: 10