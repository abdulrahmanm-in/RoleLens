services:
  api:
    build:
      target: testing

    container_name: job_market_api_test

    environment:
      - DATABASE_URL=postgresql://job_user:job_password@postgres:5432/jobpulse_test
      - TEST_DATABASE_URL=postgresql://job_user:job_password@postgres:5432/jobpulse_test
      - ADZUNA_APP_ID=${ADZUNA_APP_ID}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY}

    command: pytest -vv -ra --cov=app

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: job_market_postgres_test

    environment:
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: job_password
      POSTGRES_DB: jobpulse_test

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_user -d jobpulse_test"]
      interval: 5s
      timeout: 5s
      retries: 10