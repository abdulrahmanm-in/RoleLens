name: Job Market Pulse Docker CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  lint_and_test:
    name: Lint & Run Docker Test Suite
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://job_user:job_password@postgres:5432/jobpulse_test
      TEST_DATABASE_URL: postgresql://job_user:job_password@postgres:5432/jobpulse_test

      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Fast Syntax & Lint Check (Fails in ~3s if syntax is wrong)
      # ---------------------------------------------------------
      - name: Set up Python for Fast Linting
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Flake8 Code Quality Check
        run: |
          pip install flake8
          # Stop build on syntax errors or undefined variables
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      # ---------------------------------------------------------
      # Docker Environment Setup & Caching
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Environment
        run: |
          docker --version
          docker compose version

      # ---------------------------------------------------------
      # Build & Run Containerized Tests
      # ---------------------------------------------------------
      - name: Build Test Containers
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            build

      - name: Run Pytest Suite Inside Container
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up \
            --abort-on-container-exit \
            --exit-code-from api

      - name: Cleanup Containers & Volumes
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            down -v --remove-orphans

  prod_build_check:
    name: Verify Production Docker Target
    runs-on: ubuntu-latest
    needs: lint_and_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Production Stage Build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false